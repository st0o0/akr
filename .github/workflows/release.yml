name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    uses: st0o0/github-workflows/.github/workflows/release-please.yml@main
    permissions:
      contents: write
      pull-requests: write

  pack:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-latest
          - rid: any
            os: ubuntu-latest
          - rid: pointer
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6

      - name: Pack
        run: >-
          dotnet pack src/Akr/Akr.csproj
          -c Release
          -p:Version=${{ needs.release-please.outputs.version }}
          ${{ matrix.rid != 'pointer' && format('-r {0}', matrix.rid) || '' }}
          ${{ matrix.rid == 'any' && '-p:PublishAot=false' || '' }}
          -o ./packages

      - uses: actions/upload-artifact@v5
        with:
          name: pack-${{ matrix.rid }}
          path: ./packages/*.nupkg

  publish:
    needs: [release-please, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    environment:
      name: nuget
      url: https://www.nuget.org/packages/Akr
    steps:
      - uses: actions/setup-dotnet@v6

      - uses: actions/download-artifact@v5
        with:
          pattern: pack-*
          merge-multiple: true
          path: ./packages

      - name: Login to NuGet
        id: nuget-login
        uses: NuGet/login@v1
        with:
          nuget-sources: https://api.nuget.org/v3/index.json
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: >-
          dotnet nuget push ./packages/*.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --skip-duplicate

      - name: Push to GitHub Packages
        run: >-
          dotnet nuget push ./packages/*.nupkg
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --api-key ${{ github.token }}
          --skip-duplicate

      - name: Attach packages to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.release-please.outputs.version }}
          files: ./packages/*.nupkg
