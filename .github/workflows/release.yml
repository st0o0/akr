name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    uses: st0o0/github-workflows/.github/workflows/release-please.yml@main
    permissions:
      contents: write
      pull-requests: write

  nuget:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: st0o0/github-workflows/.github/workflows/dotnet-build-nuget.yml@main
    with:
      solution-file: akr.slnx
      version: ${{ needs.release-please.outputs.version }}
      locked-mode: false

  publish:
    needs: [release-please, nuget]
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4

      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: packages

      - name: Push to NuGet
        run: |
          dotnet nuget push "packages/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_USER }}

      - name: Attach to release and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          for nupkg in packages/*.nupkg; do
            gh release upload "$TAG" "$nupkg" --repo "$REPO"
          done
          gh release edit "$TAG" --repo "$REPO" --draft=false
