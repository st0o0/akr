name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    uses: st0o0/github-workflows/.github/workflows/release-please.yml@main
    permissions:
      contents: write
      pull-requests: write

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: st0o0/github-workflows/.github/workflows/dotnet-build-nuget.yml@main
    with:
      version: ${{ needs.release-please.outputs.version }}
      solution-file: akr.slnx
    permissions:
      contents: read

  publish:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment:
      name: nuget
      url: https://www.nuget.org/packages/Akr
    steps:
      - uses: actions/setup-dotnet@v6
      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./packages
      - uses: NuGet/login@v1
        with:
          nuget-sources: https://api.nuget.org/v3/index.json
          nuget-api-key: ${{ secrets.NUGET_USER }}
      - run: dotnet nuget push ./packages/*.nupkg --source https://api.nuget.org/v3/index.json --skip-duplicate
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.release-please.outputs.version }}
          files: ./packages/*.nupkg
